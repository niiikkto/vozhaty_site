{% extends 'index.html' %}
{% block content %}

<div class="login-container">
    <div class="login-box">
        <h2>Вход в аккаунт</h2>
        <p class="login-subtitle">Для администратора</p>

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label>Имя пользователя или Email</label>
                {{ form.username }}
            </div>

            <div class="form-group">
                <label>Пароль</label>
                {{ form.password }}
            </div>

            <button type="submit" class="btn btn--primary login-btn">Войти</button>
        </form>

        <p class="login-help">
            Для администратора:<br>
            <strong>Логин:</strong> admin<br>
            <strong>Пароль:</strong> admin.123
        </p>
    </div>
</div>

{% endblock %}
